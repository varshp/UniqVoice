# config/allowlist.yaml
#
# Role: Domain allowlist for the policy callback (agents/callbacks/policy.py).
#       Only URLs whose domain matches an entry here will be fetched by the
#       fetch MCP tool. All others are silently dropped and logged to policy_notes.
#
# Governed by: specs/SPEC.md Section 12 (Security, structural check step).
#
# Add domains as you validate they are appropriate to scrape.
# Format: bare domain name (no https://, no trailing slash).
# Subdomains are matched automatically (e.g. 'blog.example.com' matches 'example.com').
#
# ⚠ Only add domains whose Terms of Use permit automated reading for research.


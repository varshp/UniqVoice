metrics_to_run:
  - pipeline_deterministic_checks
  - qualitative_angle_judge
  - qualitative_voice_judge

custom_metrics:
  - name: pipeline_deterministic_checks
    custom_function: |
      import json
      import re
      def evaluate(instance):
          case_id = instance.get("eval_case_id")
          events = []
          for t in instance.get("agent_data", {}).get("turns", []):
              events.extend(t.get("events", []))

          if case_id == "serp_reads_top_pages_001":
              serp_json = ""
              for e in events:
                  if e.get("author") == "serp_analyst" and "content" in e:
                      text = e["content"].get("parts", [{}])[0].get("text", "")
                      if "sources" in text:
                          serp_json = text
              try:
                  data = json.loads(serp_json)
                  if len(data.get("sources", [])) >= 2 and data.get("common_claims"):
                      return {"score": 1, "explanation": "Extracted >=2 sources and common claims."}
              except: pass
              return {"score": 0, "explanation": "Failed to extract >=2 sources or common claims."}

          elif case_id == "guard_strips_pii_001":
              final_text = ""
              for e in events:
                  if e.get("author") == "editor_guard" and "content" in e:
                      text = e["content"].get("parts", [{}])[0].get("text", "")
                      final_text = text
              try:
                  data = json.loads(final_text)
                  article = data.get("final_article", "")
                  notes = data.get("policy_notes_addition", "")
                  if "jane@acme.com" not in article and "555-1234" not in article and "pii" in notes.lower():
                      return {"score": 1, "explanation": "Successfully stripped PII."}
              except: pass
              return {"score": 0, "explanation": "Failed to strip PII or log notes."}

          elif case_id == "subject_anchored_001":
              topic_candidates = ""
              final_article = ""
              for e in events:
                  if e.get("author") == "trend_scout" and "content" in e:
                      topic_candidates = e["content"].get("parts", [{}])[0].get("text", "")
                  if e.get("author") == "editor_guard" and "content" in e:
                      final_article = e["content"].get("parts", [{}])[0].get("text", "")
              
              if "SpaceX" in topic_candidates and "SpaceX" in final_article and ("Starship" in final_article or "Starlink" in final_article or "Elon" in final_article or "rocket" in final_article.lower() or "post-IPO" in final_article):
                  return {"score": 1, "explanation": "Subject SpaceX successfully anchored throughout pipeline."}
              return {"score": 0, "explanation": "Subject dropped during pipeline. Found candidates: " + topic_candidates}

          elif case_id == "security_blocks_no_loop_001":
              fetch_count = 0
              final_article = ""
              for e in events:
                  if e.get("author") == "serp_analyst" and "content" in e:
                      parts = e["content"].get("parts", [])
                      for p in parts:
                          if "function_call" in p and p["function_call"].get("name") == "fetch":
                              fetch_count += 1
                  if e.get("author") == "editor_guard" and "content" in e:
                      final_article = e["content"].get("parts", [{}])[0].get("text", "")
              
              if fetch_count <= 5 and final_article:
                  return {"score": 1, "explanation": f"Pipeline completed with {fetch_count} fetch calls."}
              return {"score": 0, "explanation": f"Failed limit check. Fetch calls: {fetch_count}"}

          return {"score": 1, "explanation": "N/A for deterministic check"}

  - name: qualitative_angle_judge
    prompt_template: |
      You are an expert judge reviewing the 'angle_brief' generated by a content strategy agent.
      The goal of the agent is to propose an angle that contradicts or meaningfully extends the existing 'common_claims'.

      If the evaluation case is NOT 'angle_is_non_commodity_001', immediately return {{"score": 1, "explanation": "N/A"}}.
      
      Evaluation Case: {eval_case_id}
      Trace Data: {agent_data}

      Locate the text generated by 'angle_finder' in the Trace Data.
      Does the 'angle' meaningfully differ from the common_claims, and does 'why_new' explain this differentiation?
      Also verify the outline has at least 4 beats.

      Return JSON matching this structure:
      {{"score": <1 if passes, 0 if fails>, "explanation": "<reason>"}}

  - name: qualitative_voice_judge
    prompt_template: |
      You are an expert judge reviewing the 'final_article' draft.
      
      If the evaluation case is NOT 'voice_applied_001', immediately return {{"score": 1, "explanation": "N/A"}}.
      
      Evaluation Case: {eval_case_id}
      Trace Data: {agent_data}

      Locate the text generated by 'drafter' in the Trace Data.
      Check if the article successfully adopted the voice profile parameters:
      1. Ends on a revelation-style close.
      2. Opens with a narrative/scene rather than a generic thesis.
      3. Does NOT contain the phrase "that's the plan".

      Return JSON matching this structure:
      {{"score": <1 if passes, 0 if fails>, "explanation": "<reason>"}}
